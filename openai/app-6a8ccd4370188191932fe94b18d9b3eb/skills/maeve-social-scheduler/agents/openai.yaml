interface:
  display_name: "Maeve Social"
  short_description: "Manage social media content"
  default_prompt: "Use $maeve-social-scheduler to find my Maeve workspace and create a draft using the connected tools."
dependencies:
  tools:
    - type: "mcp"
      value: "maeve"
      description: "Manage Maeve content, media and analytics with individually exposed tools."
      transport: "streamable_http"
      url: "https://api.maevesocial.com/mcp/openai"
policy:
  allow_implicit_invocation: true
